<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="./../CSS/mystyle.css">
    <link rel="stylesheet" href="./../CSS/forgetPassword.css">
</head>
<body>
<div class="forgot-wrapper">
    <div class="forgot-left">
        <img src="./../assets/Tareq/img1.png" alt="Fashion image">
    </div>

    <div class="forgot-right">
        <a href="#" class="back-link">← Back</a>
        <div class="form-container">
            <h2>Forgot Password</h2>
            <p>Enter your registered email address. We’ll send you a code to reset your password.</p>

            <form>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="robertfox@example.com" required>

                <button type="submit" class="btn-primary">Send OTP</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
